<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Make a Wish</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Jost:wght@400;500&display=swap');

        :root {
            --bg-1: #1c1330;
            --bg-2: #120b22;
            --gold: #e8bc55;
            --gold-soft: #f6d98a;
            --plate: #f2e7d3;
            --frost: #f2d1c9;
            --cake-1: #7a3652;
            --cake-2: #a75a72;
            --cake-3: #e8a9a0;
            --ink: #f5ecdc;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
            background:
                radial-gradient(ellipse at 50% 20%, #2b1d47 0%, var(--bg-1) 45%, var(--bg-2) 100%);
            font-family: 'Jost', sans-serif;
            color: var(--ink);
            overflow: hidden;
        }

        .scene {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 48px 24px 40px;
        }

        /* ambient stars */
        .stars {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1.5px 1.5px at 20% 20%, rgba(255, 255, 255, .55), transparent),
                radial-gradient(1.5px 1.5px at 70% 15%, rgba(255, 255, 255, .4), transparent),
                radial-gradient(1px 1px at 40% 35%, rgba(255, 255, 255, .5), transparent),
                radial-gradient(1.5px 1.5px at 85% 40%, rgba(255, 255, 255, .35), transparent),
                radial-gradient(1px 1px at 10% 55%, rgba(255, 255, 255, .4), transparent),
                radial-gradient(1.5px 1.5px at 60% 8%, rgba(255, 255, 255, .4), transparent);
            pointer-events: none;
        }

        .heading {
            text-align: center;
            z-index: 2;
        }

        .heading h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(34px, 8vw, 52px);
            margin: 0;
            letter-spacing: .5px;
            background: linear-gradient(180deg, var(--gold-soft), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 18px rgba(232, 188, 85, .35));
        }

        .heading p {
            margin: 8px 0 0;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #cbb7e0;
            opacity: .75;
        }

        .cake-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .candles {
            display: flex;
            gap: 26px;
            margin-bottom: -6px;
            z-index: 3;
        }

        .candle {
            position: relative;
            width: 12px;
            height: 64px;
            border-radius: 5px;
            background: linear-gradient(90deg, #d99a30, var(--gold) 45%, #f7dd9c 60%, #c77f1e);
            box-shadow: inset -2px 0 3px rgba(0, 0, 0, .35);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .candle:nth-child(2) {
            height: 82px;
        }

        .wick {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 9px;
            background: #3a2a1a;
            border-radius: 1px;
            transition: opacity .3s ease;
        }

        .flame {
            position: absolute;
            left: 50%;
            bottom: 100%;
            transform: translateX(-50%);
            width: 14px;
            height: 26px;
            border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
            background: radial-gradient(circle at 50% 75%, #fff6cf 0%, var(--gold-soft) 35%, #f4a13c 65%, #d9531f 100%);
            box-shadow: 0 0 14px 4px rgba(247, 180, 60, .55), 0 0 30px 10px rgba(247, 140, 30, .25);
            animation: flicker 1.6s ease-in-out infinite;
            transform-origin: 50% 100%;
            transition: opacity .25s ease, transform .3s ease;
        }

        .candle:nth-child(1) .flame {
            animation-delay: .1s;
        }

        .candle:nth-child(3) .flame {
            animation-delay: .35s;
        }

        @keyframes flicker {

            0%,
            100% {
                transform: translateX(-50%) rotate(-3deg) scaleY(1);
            }

            25% {
                transform: translateX(-50%) rotate(2deg) scaleY(1.05);
            }

            50% {
                transform: translateX(-50%) rotate(-2deg) scaleY(.96);
            }

            75% {
                transform: translateX(-50%) rotate(3deg) scaleY(1.03);
            }
        }

        .candle.out .flame {
            opacity: 0;
            transform: translateX(-50%) scaleY(.2);
            animation: none;
        }

        .candle.out .wick {
            opacity: .5;
        }

        .smoke {
            position: absolute;
            left: 50%;
            bottom: 100%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(220, 215, 225, .55);
            opacity: 0;
            pointer-events: none;
        }

        .candle.out .smoke {
            animation: puff 1s ease-out forwards;
        }

        @keyframes puff {
            0% {
                opacity: .6;
                transform: translateX(-50%) translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-38px) scale(3.2);
            }
        }

        .cake {
            position: relative;
            width: min(78vw, 300px);
        }

        .top {
            width: 100%;
            height: 46px;
            border-radius: 50%;
            background: radial-gradient(ellipse at 42% 35%, var(--cake-2), var(--cake-1) 75%);
            position: relative;
            z-index: 2;
            box-shadow: inset 0 -6px 10px rgba(0, 0, 0, .25);
        }

        .layer {
            width: 100%;
            position: relative;
            margin-top: -14px;
            border-radius: 0 0 14px 14px;
            z-index: 1;
        }

        .layer-1 {
            height: 66px;
            background: linear-gradient(180deg, var(--cake-3), var(--frost) 60%, #e9bdb3);
            clip-path: polygon(0 0, 100% 0, 100% 82%, 50% 100%, 0 82%);
        }

        .layer-1::before {
            content: "";
            position: absolute;
            inset: 0;
            background-repeat: repeat-x;
            background-size: 34px 20px;
            background-image: radial-gradient(circle at 50% 0, transparent 60%, var(--cake-1) 62%, transparent 64%);
            opacity: .18;
        }

        .layer-2 {
            height: 58px;
            margin-top: -6px;
            background: linear-gradient(180deg, #b56d80, var(--cake-2) 70%);
            border-radius: 0 0 20px 20px;
        }

        .plate {
            width: 112%;
            margin-left: -6%;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(180deg, var(--plate), #d8c8a9);
            margin-top: -4px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, .45);
        }

        .hint {
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #b7a4d4;
            opacity: .6;
            z-index: 2;
            text-align: center;
            transition: opacity .4s ease;
        }

        .wish-msg {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translate(-50%, -50%) scale(.9);
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s ease, transform .5s ease;
            z-index: 5;
        }

        .wish-msg.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .particle span {
            position: absolute;
            border-radius: 50%;
            animation: floatup 6s linear infinite;
            opacity: 0.8;
            background: white;
        }

        .particle span:nth-child(odd) {
            background: #685358;
        }

        .particle span:nth-child(even) {
            background: white;
        }

        .particle span:nth-child(1) {
            width: 8px;
            height: 8px;
            left: 10%;
            animation-delay: 0s;
        }

        .particle span:nth-child(2) {
            width: 12px;
            height: 12px;
            left: 20%;
            animation-delay: 1s;
        }

        .particle span:nth-child(3) {
            width: 6px;
            height: 6px;
            left: 30%;
            animation-delay: 2s;
        }

        .particle span:nth-child(4) {
            width: 10px;
            height: 10px;
            left: 40%;
            animation-delay: 0.5s;
        }

        .particle span:nth-child(5) {
            width: 7px;
            height: 7px;
            left: 50%;
            animation-delay: 1.5s;
        }

        .particle span:nth-child(6) {
            width: 9px;
            height: 9px;
            left: 60%;
            animation-delay: 2.5s;
        }

        .particle span:nth-child(7) {
            width: 11px;
            height: 11px;
            left: 70%;
            animation-delay: 0.8s;
        }

        .particle span:nth-child(8) {
            width: 6px;
            height: 6px;
            left: 80%;
            animation-delay: 1.2s;
        }

        .particle span:nth-child(9) {
            width: 8px;
            height: 8px;
            left: 90%;
            animation-delay: 2s;
        }

        .particle span:nth-child(10) {
            width: 10px;
            height: 10px;
            left: 15%;
            animation-delay: 3s;
        }

        .wish-msg h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(22px, 6vw, 30px);
            margin: 0;
            color: var(--gold-soft);
            text-shadow: 0 0 22px rgba(232, 188, 85, .5);
        }

        .wish-msg span {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            letter-spacing: 2px;
            color: #d9c9ef;
            text-transform: uppercase;
        }

        img {
            border-radius: 30px;
            width: 300px;
            position: relative;
            left: -550px;
            top: 300px;
        }

        footer {
            z-index: 2;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #7c6a9c;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="stars"></div>

        <div class="heading">
            <h1>Make a Wish</h1>
            <p>May all your dreams come true</p>
            <p>wishing you a fantastic birthday filled with love,laughter and all your favorite things.here's to another
                amazing year ahead.</p>
        </div>

        <div class="cake-wrap">
            <div class="wish-msg" id="wishMsg">
                <h2>Wish granted ✦</h2>
                <span>Happy Birthday</span>
            </div>


            <div class="candles" id="candles">
                <div class="candle" data-i="0">
                    <div class="wick"></div>
                    <div class="flame"></div>
                    <div class="smoke"></div>
                </div>
                <div class="candle" data-i="1">
                    <div class="wick"></div>
                    <div class="flame"></div>
                    <div class="smoke"></div>
                </div>
                <div class="candle" data-i="2">
                    <div class="wick"></div>
                    <div class="flame"></div>
                    <div class="smoke"></div>
                </div>
            </div>

            <div class="cake">

                <div class="top"></div>
                <div class="layer layer-1"></div>
                <div class="layer layer-2"></div>
                <div class="plate"></div>
                <div class="particle">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span><span></span>

                </div>
            </div>
            <p class="tap_text">Tap to play music</p>
            <audio id="song" loop>
                <source src="Wiz_Khalifa_feat_Charlie_Puth_-_See_You_Again_Qoret.com.mp3" type="audio/mpeg">
        </div>

        <p class="hint" id="hint">Tap the flames to blow out the candles</p>

    </div>

    <script>
        const candles = document.querySelectorAll('.candle');
        const hint = document.getElementById('hint');
        const wishMsg = document.getElementById('wishMsg');

        candles.forEach(c => {
            c.addEventListener('click', () => {
                if (!c.classList.contains('out')) {
                    c.classList.add('out');
                    checkAllOut();
                }
            });
        });

        function checkAllOut() {
            const allOut = Array.from(candles).every(c => c.classList.contains('out'));
            if (allOut) {
                hint.style.opacity = 0;
                wishMsg.classList.add('show');
            }
        }

        document.body.addEventListener('click', () => {

            const song = document.getElementById('song').play().catch(err =>
                console.log("Audio error:", err));
            document.querySelector('.tap_text').style.display = 'none';
        }, {once: true});
    </script>
</body>

</html>
